name: WA Sender checks

on:
  push:
    branches:
      - main
      - hardening/v4-1-cloud-shell
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check lib/campaign-utils.js
          node --check lib/connection-utils.js
          node --check tests/campaign-utils.test.js
      - name: Run unit tests
        run: npm test
